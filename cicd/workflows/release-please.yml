# =============================================================================
# Release Please - cognitive-core framework
# =============================================================================
# Automated versioning and release management using Google's release-please.
# Creates Release PRs from conventional commits and publishes GitHub Releases.
#
# Prerequisites:
#   - release-please-config.json in repo root
#   - .release-please-manifest.json in repo root
#   - version.txt as source of truth (for release-type: simple)
#
# Customize:
#   - target-branch: your default branch (main, master, develop, development)
#   - config-file/manifest-file: paths if non-standard
# =============================================================================
name: Release Please

on:
  push:
    branches:
      - main               # Change to your default branch

permissions:
  contents: write
  pull-requests: write
  actions: write       # start CI on the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main    # Change to your default branch

      # A release PR opened or updated with GITHUB_TOKEN triggers no workflows,
      # so start CI on its branch; the checks land on the PR head commit.
      # Not fatal: projects without a dispatchable CI workflow keep releasing.
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          CI_WORKFLOW: ci.yml  # Change to your CI workflow file
        run: |
          branch=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty')
          if [ -z "$branch" ]; then
            echo "::warning::release PR branch unknown, CI not started"
          elif ! gh workflow run "$CI_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$branch"; then
            echo "::warning::could not start ${CI_WORKFLOW} on ${branch}"
          fi
